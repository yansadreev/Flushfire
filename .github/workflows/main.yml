
name: Build Flushfire with official NeoForge

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Flushfire
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Flushfire-JAR
          path: build/libs/*.jar
          if-no-files-found: error
