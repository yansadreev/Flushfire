plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    mavenCentral()
}
dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

// NeoGradle userdev supplies Mixin annotations via NeoForge.
// Do not shade or package Minecraft, NeoForge, Mixin, or Sodium.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
jar {
    manifest {
        attributes('Specification-Title': 'Flushfire',
                   'Specification-Vendor': 'Flushfire project',
                   'Implementation-Title': 'Flushfire',
                   'Implementation-Version': project.version)
    }
}
